{% extends "layout.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="error-container">
                <h1 class="display-1 text-danger">500</h1>
                <h2 class="mb-4">Server Error</h2>
                <p class="lead mb-4">Something went wrong on our end. We're working to fix the problem and will be back shortly.</p>
                <div class="mb-5">
                    <img src="{{ url_for('static', filename='img/500.svg') }}" alt="500 Illustration" class="img-fluid" style="max-height: 300px;">
                </div>
                <div>
                    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">Go to Homepage</a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg ms-2">Go Back</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
